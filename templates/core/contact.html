{% extends 'base.html' %}
{% block title %}Contact Us — TOMMY.X{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="tx-page-title">Contact Us</h1>
  <div class="row g-5">
    <div class="col-lg-6">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="tx-btn-primary">Send Message</button>
      </form>
    </div>
    <div class="col-lg-6">
      <h6 class="tx-footer-heading text-dark">Get in Touch</h6>
      <p><i class="bi bi-envelope"></i> tommy.xattire@gmail.com</p>
      <p><i class="bi bi-telephone"></i> 9080246113 / 9751999225</p>
      <p><i class="bi bi-truck"></i> Pan-India delivery · Online payment only · No returns / exchanges</p>
    </div>
  </div>
</div>
{% endblock %}

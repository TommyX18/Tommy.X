databases:
  - name: tommyx-db
    plan: free
    databaseName: tommyx_db
    user: tommyx_user

services:
  - type: web
    name: tommyx-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn tommyx_site.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tommyx-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
